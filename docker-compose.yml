name: ${COMPOSE_PROJECT_NAME:-stratum-hidden}
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-stratum-hidden}-db
    environment:
      POSTGRES_DB: stratum_hidden
      POSTGRES_USER: fresh
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fresh_demo_password}
    ports: ["${DB_PORT:-17738}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresh -d stratum_hidden"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-stratum-hidden}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-stratum-hidden}-backend
    environment: &backend-env
      DATABASE_URL: postgresql://fresh:${DB_PASSWORD:-fresh_demo_password}@db:5432/stratum_hidden
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-stratum-hidden-development-secret-change-this}
      SEED_DEMO: ${SEED_DEMO:-true}
      TASK_MODE: redis
      ARTIFACT_DIR: /artifacts
    ports: ["${BACKEND_PORT:-19238}:8000"]
    volumes: ["shared-artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-stratum-hidden}-worker
    command: ["python", "-m", "src.worker"]
    environment: *backend-env
    volumes: ["shared-artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-float(Path('/tmp/worker-heartbeat').read_text())<90"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-stratum-hidden}-frontend
    ports: ["${FRONTEND_PORT:-18238}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  shared-artifacts:
